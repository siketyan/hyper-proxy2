name: Checks

on:
  push:
    branches:
      - main
  pull_request: ~

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        tls:
          - no-tls
          - native-tls
          - rustls-native-roots
          - rustls-webpki-roots
          - rustls-native-roots-mixed-providers
          - rustls-webpki-roots-mixed-providers
          - openssl
        include:
          - tls: no-tls
            features: ''
          - tls: native-tls
            features: tls
          - tls: rustls-native-roots
            features: rustls
          - tls: rustls-webpki-roots
            features: rustls-webpki
          - tls: rustls-native-roots-mixed-providers
            features: rustls,tokio-rustls/aws_lc_rs
          - tls: rustls-webpki-roots-mixed-providers
            features: rustls-webpki,tokio-rustls/aws_lc_rs
          - tls: openssl
            features: openssl-tls
    steps:
      - uses: actions/checkout@v4

      - name: Install latest stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy

      - name: Run rustfmt
        run: cargo fmt --all --check

      - name: Run clippy
        uses: giraffate/clippy-action@v1
        with:
          reporter: 'github-pr-check'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: cargo test --no-default-features --features '${{ matrix.features }}'
